<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <title>Flexbox Task 2</title>
    <style>
        html {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        .column {
            display: flex;
            flex-direction: row;
            height: 100%;
        }
        .left {
            align-items: flex-start;
        }
        .right {
            align-items: flex-end;
        }
        img {
            width: 150px;
            height: 150px;
            object-fit: cover;
        }
        .image3 {
            align-self: flex-start;
        }
        .image2 {
            align-self: center;
        }
        .image1 {
            align-self: flex-end;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="column left">
            <img src="https://picsum.photos/150/150?random=1" alt="1" class="image1">
            <img src="https://picsum.photos/150/150?random=3" alt="3" class="image2">
            <img src="https://picsum.photos/150/150?random=5" alt="5" class="image3">
        </div>
        <div class="column right">
            <img src="https://picsum.photos/150/150?random=2" alt="2" class="image3">
            <img src="https://picsum.photos/150/150?random=4" alt="4" class="image2">
            <img src="https://picsum.photos/150/150?random=6" alt="6" class="image1">
        </div>
    </div>
</body>
</html>
