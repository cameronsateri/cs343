<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <title>Flexbox</title>
    <style>
        html {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-content: center;
            height: 100vh;
        }
        .row {
            min-width: 80vw;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        img {
            max-width: 10vw;
        }
        .center-image {
            max-width: 25vw;
        }
    </style>
</head>

<body>
    <div class="row">
        <img src="https://picsum.photos/250/250?random=1" alt="1">
        <img src="https://picsum.photos/250/250?random=2" alt="2" class="center-image">
        <img src="https://picsum.photos/250/250?random=3" alt="3">
    </div>
</body>
</html>
